name: Build TASX Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Mostrar lineas 195-255 de Infra\warm.cc
      run: |
        $lines = Get-Content "Infra\warm.cc"
        for ($i = 194; $i -lt [Math]::Min(256, $lines.Count); $i++) {
          Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
        }

    - name: Corregir TASX.vcxproj y compilar con NOMINMAX y UTF-8
       env:
        CL: "/DNOMINMAX /utf-8"
      run: |
        (Get-Content TASX.vcxproj) -replace '<ControlFlowGuard>true</ControlFlowGuard>', '<ControlFlowGuard>Guard</ControlFlowGuard>' | Set-Content TASX.vcxproj
        msbuild TASX.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

    - name: Preparar carpeta final con EXE y BAT
      run: |
        mkdir dist
        Get-ChildItem -Path . -Filter "TASX.exe" -Recurse | Copy-Item -Destination "dist\"
        if (Test-Path "Install") { Copy-Item -Path "Install\*.bat" -Destination "dist\" }

    - name: Subir ejecutable compilado
      uses: actions/upload-artifact@v4
      with:
        name: TASX-Ready-To-Use
        path: dist/*
